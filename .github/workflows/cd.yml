name: CD

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verifica che FIRMWARE_VERSION corrisponda al tag
        run: |
          DEFINED=$(grep -oP '#define FIRMWARE_VERSION "\K[^"]+' firmware/src/config.h)
          TAG="${{ github.ref_name }}"
          if [ "$DEFINED" != "$TAG" ]; then
            echo "FIRMWARE_VERSION in config.h ($DEFINED) non corrisponde al tag ($TAG)"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache toolchain PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Installa PlatformIO
        run: pip install --upgrade platformio

      - name: Prepara secrets.h fittizio (solo per compilare, nessun valore reale)
        run: cp firmware/src/secrets.h.example firmware/src/secrets.h

      - name: Build firmware (env freenove_cyd35)
        working-directory: firmware
        run: pio run -e freenove_cyd35

      - name: Checksum informativo (il server calcola comunque il proprio MD5)
        working-directory: firmware/.pio/build/freenove_cyd35
        run: md5sum firmware.bin > firmware.bin.md5

      - name: Pubblica la GitHub Release con firmware.bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            firmware/.pio/build/freenove_cyd35/firmware.bin \
            firmware/.pio/build/freenove_cyd35/firmware.bin.md5 \
            --title "${{ github.ref_name }}" \
            --generate-notes

  docker-publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login a GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nome immagine in minuscolo
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/iot-display-hub-server" >> "$GITHUB_OUTPUT"

      - name: Metadati e tag
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=sha,format=short

      - name: Build e push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cd-server-arm64
          cache-to: type=gha,scope=cd-server-arm64,mode=max