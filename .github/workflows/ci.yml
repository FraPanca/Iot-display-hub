name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-and-install
      - name: Lint
        working-directory: server
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-and-install
      - name: Jest
        working-directory: server
        run: npm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-and-install
      - name: npm audit (solo dipendenze di produzione)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high

  firmware-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache toolchain PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('firmware/platformio.ini') }}

      - name: Installa PlatformIO
        run: pip install --upgrade platformio

      - name: Prepara secrets.h fittizio (solo per compilare, nessun valore reale)
        run: cp firmware/src/secrets.h.example firmware/src/secrets.h

      - name: Build firmware (env freenove_cyd35)
        working-directory: firmware
        run: pio run -e freenove_cyd35

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build immagine server senza push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          target: prod
          push: false
          cache-from: type=gha,scope=ci-server
          cache-to: type=gha,scope=ci-server,mode=max

  ci-success:
    if: always()
    needs: [lint, test, audit, firmware-build, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Verifica esito di tutti i job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "Almeno un job non e riuscito: $RESULTS"
              exit 1
            fi
          done